[project]
name = "popgenlm-bench"
version = "0.2.0"
description = "Reproducible evaluation of genomic language-model variant scores using population-genetic and evolutionary evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Tahir Ali" }
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

v03 = [
    "scipy>=1.11,<2",
    "pysam>=0.22,<1",
    "scikit-learn>=1.3,<2",
    "umap-learn>=0.5,<1",
    "matplotlib>=3.8,<4",
]

plantcad = [
    "torch>=2.0",
    "transformers>=4.0",
    "tokenizers>=0.15",
]

viz = [
    "matplotlib>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popgenlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "notebooks",
    "scripts/v0.1",
]

[tool.ruff.lint]
ignore = ["EXE002"]
